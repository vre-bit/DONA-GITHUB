* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.band { background: linear-gradient(135deg, var(--navy-deep), var(--navy)); color: var(--on-navy); border-bottom: 4px solid var(--gold); }
.band-in { max-width: 1280px; margin: 0 auto; padding: 18px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.band h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.band h1 span { color: var(--gold); }
.brand { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.grow { flex: 1; min-width: 0; }
.sync { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; max-width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa7ba; flex: none; }

.btn { border: 1px solid var(--navy); background: var(--navy); color: var(--on-navy); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1c2b3a; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.band .btn.ghost { color: var(--on-navy); border-color: rgba(255,255,255,.4); }
.btn:disabled { opacity: .5; cursor: default; }
.bar { height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; width: 160px; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }

.setup { max-width: 1280px; margin: 14px auto 0; padding: 0 16px; }
.setup .note { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 8px; padding: 12px 16px; }
.setup code { font-family: var(--mono); background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; }

.layout { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 860px) { .side { position: static; max-height: 280px; } }
.side h2 { margin: 0; padding: 12px 14px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.vlist { overflow-y: auto; padding: 0 6px 8px; }
.v { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; min-width: 0; }
.v:hover { background: var(--surface2); }
.v[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.v .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; flex: none; }
.badge.open { background: var(--red-bg); color: var(--red); }
.badge.ok { background: var(--good-bg); color: var(--good); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; margin-bottom: 14px; }

.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }

.tile { padding: 12px 14px; border-top: 3px solid var(--gold); min-width: 0; }

.act { font-size: 13px; margin-top: 6px; padding: 6px 10px; background: var(--warn-bg); border-radius: 6px; color: var(--warn-ink); }
.lowc { font-size: 12px; color: var(--muted); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.foot { max-width: 1280px; margin: 0 auto; padding: 0 16px 36px; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy-deep); color: var(--on-navy); padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 5; max-width: calc(100% - 32px); }
.toast[hidden], [hidden] { display: none !important; }
</style>

    return Object.keys(g).map(function (k) { return g[k]; }).map(function (x) {
      x.open = x.recs.filter(function (r) { return r.status === "open"; }).length;
      x.cn = x.recs.reduce(function (n, r) { return n + r.credit_notes.length; }, 0);
      x.last = x.recs.reduce(function (m, r) { return (r.last_activity || "") > m ? r.last_activity : m; }, "");
      return x;
    }).sort(function (a, b) { return b.open - a.open || b.recs.length - a.recs.length || a.name.localeCompare(b.name); });
  }

  /* ---------- rendering ---------- */
  function render() {
    var vis = visible(), gs = groups(vis);
    if (S.sel !== "all" && !gs.some(function (g) { return g.key === S.sel; })) S.sel = "all";
    renderSide(vis, gs); renderTiles(S.sel === "all" ? vis : vis.filter(function (r) { return r.vendorKey === S.sel; }), S.sel === "all");
    S.sel === "all" ? renderAll(vis, gs) : renderVendor(gs.filter(function (g) { return g.key === S.sel; })[0]);
    renderFoot();
  }
  function renderSide(vis, gs) {
    var h = '<button class="v" data-v="all" type="button" aria-pressed="' + (S.sel === "all") + '"><span class="n">All vendors</span><span class="badge ok">' + gs.length + "</span></button>";
    gs.forEach(function (g) {
      h += '<button class="v" data-v="' + esc(g.key) + '" type="button" aria-pressed="' + (S.sel === g.key) + '"><span class="n">' + esc(g.name) + "</span>" +
        (g.open ? '<span class="badge open" title="Open items">' + g.open + "</span>" : '<span class="badge ok" title="Nothing open">' + g.recs.length + "</span>") + "</button>";
    });
    $("vlist").innerHTML = gs.length ? h : '<div class="empty">No vendors match.</div>';
  }
  function tile(k, v, s, alert) { return '<div class="card tile' + (alert ? " alert" : "") + '"><div class="k">' + k + '</div><div class="val">' + v + '</div><div class="s">' + s + "</div></div>"; }
  function renderTiles(recs, all) {
    var vendors = {}; recs.forEach(function (r) { vendors[r.vendorKey] = 1; });
    var cn = 0, val = 0, withAmt = 0, open = 0, pend = 0;
    recs.forEach(function (r) { r.credit_notes.forEach(function (c) { cn++; if (typeof c.amount === "number") { val += c.amount; withAmt++; } }); if (r.status === "open") open++; pend += r.pending.length; });
    $("tiles").innerHTML =
      (all ? tile("Vendors", Object.keys(vendors).length, "with credit note activity") : tile("Threads", recs.length, "emails about credit notes")) +
      tile("Credit notes received", cn, "documents or details in emails") +
      tile("Open items", open, pend + " invoice" + (pend === 1 ? "" : "s") + " awaiting a credit note", open > 0) +
      tile("Value stated", withAmt ? money(val) : "-", withAmt + " of " + cn + " notes state an amount");
  }
  function fuRows(recs) {
    return recs.filter(function (r) { return r.status === "open"; }).map(function (r) {
      var asked = r.pending.map(function (p) { return p.asked_date; }).filter(Boolean).sort()[0] || r.last_activity;
      return { r: r, days: daysSince(asked), asked: asked };
    }).sort(function (a, b) { return (b.days || 0) - (a.days || 0); });
  }
  function renderAll(vis, gs) {
    var fu = fuRows(vis), show = S.showAllFu ? fu : fu.slice(0, 8), h = "";
    h += '<div class="section-h"><h2>Needs follow-up</h2><span class="spacer"></span><button class="btn ghost" id="copy" type="button">Copy summary</button><button class="btn ghost" id="csv" type="button">Download CSV</button></div>';
    if (!fu.length) h += '<div class="card empty">Nothing is waiting on a vendor in this period.</div>';
    else {
      h += '<div class="note-box">' + show.map(function (x) {
        var inv = x.r.pending.map(function (p) { return p.invoice; }).filter(Boolean).slice(0, 4).join(", ");
        return '<div class="fu"><span><button data-v="' + esc(x.r.vendorKey) + '" type="button">' + esc(x.r.vendor) + "</button></span><span>" + esc(inv || x.r.summary || x.r.subject) + '</span><span class="days">' + (x.days == null ? "" : x.days + " d") + "</span></div>";
      }).join("") + "</div>";
      if (fu.length > 8) h += '<p><button class="btn ghost" id="morefu" type="button">' + (S.showAllFu ? "Show fewer" : "Show all " + fu.length) + "</button></p>";
    }
    h += '<div class="section-h"><h2>By vendor</h2></div><div class="card tbl-wrap"><table><thead><tr><th>Vendor</th><th class="num">Threads</th><th class="num">Credit notes</th><th class="num">Open</th><th>Last activity</th></tr></thead><tbody>' +
      gs.map(function (g) { return '<tr><td><button data-v="' + esc(g.key) + '" type="button">' + esc(g.name) + '</button></td><td class="num">' + g.recs.length + '</td><td class="num">' + g.cn + '</td><td class="num">' + (g.open ? '<span class="pill red">' + g.open + "</span>" : "0") + "</td><td>" + fmtDate(g.last) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    $("view").innerHTML = h;
  }
  function threadHtml(r) {
    var c = CAT[r.category] || CAT.mentioned, ents = r.entity && r.entity !== "Other/Unknown" ? '<span class="pill neutral">' + esc(r.entity) + "</span>" : "";
    var h = '<div class="thread"><div class="d">' + fmtDate(r.last_activity) + "<small>last activity</small></div><div><div class=\"t\">" + esc(r.subject) + '</div><div class="sum">' + esc(r.summary) + "</div><div>" +
      '<span class="pill ' + c[1] + '">' + c[0] + "</span>" + (r.status === "open" ? '<span class="pill red">Open</span>' : "") + ents + (r.confidence === "low" ? '<span class="lowc">low confidence</span> ' : "") +
      ' <a href="' + gmailLink(r.threadId) + '" target="_blank" rel="noopener">Open in Gmail</a></div>';
    r.credit_notes.forEach(function (n) {
      h += '<div class="cn"><span>' + fmtDate(n.received_date || n.cn_date) + "</span>" + (n.ref ? '<span class="tag">' + esc(n.ref) + "</span>" : "") +
        (n.invoices || []).slice(0, 8).map(function (i) { return '<span class="tag">' + esc(i) + "</span>"; }).join("") +
        (n.reason ? "<span>" + esc(n.reason) + "</span>" : "") + (typeof n.amount === "number" ? '<span class="amt">' + money(n.amount) + "</span>" : "") +
        (n.files || []).slice(0, 4).map(function (f) { return '<span class="tag pdf">' + esc(f) + "</span>"; }).join("") + "</div>";
    });
    r.pending.forEach(function (p) { h += '<div class="pend">Awaiting: ' + esc(p.invoice || "invoice not stated") + " · " + esc(p.reason || "") + (p.asked_date ? " · asked " + fmtDate(p.asked_date) : "") + "</div>"; });
    if (r.next_action) h += '<div class="act">Next: ' + esc(r.next_action) + "</div>";
    return h + "</div></div>";
  }
  function renderVendor(g) {
    if (!g) { $("view").innerHTML = ""; return; }
    var recs = g.recs.slice().sort(function (a, b) { return (b.last_activity || "").localeCompare(a.last_activity || ""); });
    $("view").innerHTML = '<div class="section-h"><h2>' + esc(g.name) + '</h2><span class="spacer"></span><button class="btn ghost" id="copy" type="button">Copy summary</button><button class="btn ghost" id="csv" type="button">Download CSV</button></div><div class="card">' + recs.map(threadHtml).join("") + "</div>";
  }
  function renderFoot() {
    var m = S.meta || {};
    $("foot").textContent = (S.source === "live" ? "Live from Gmail, synced " : "Snapshot from Gmail, built ") + (m.generatedAt || "") + ". " + (m.threadsClassified || S.records.length) + " threads classified by Claude. Check the PDFs for final figures before sending anything on.";
  }
  function fillEntities() {
    var set = {}; S.records.forEach(function (r) { if (r.entity && r.entity !== "Other/Unknown") set[r.entity] = 1; });
    $("entity").innerHTML = '<option value="">All entities</option>' + Object.keys(set).sort().map(function (e) { return '<option value="' + esc(e) + '">' + esc(e) + "</option>"; }).join("");
    $("entity").value = S.entity;
  }

  /* ---------- export ---------- */
  function currentRecs() { var v = visible(); return S.sel === "all" ? v : v.filter(function (r) { return r.vendorKey === S.sel; }); }
  function summaryText() {
    var recs = currentRecs(), L = ["Credit notes " + (S.sel === "all" ? "(all vendors)" : "from " + (recs[0] && recs[0].vendor)) + ", " + fmtDate(iso(periodStart())) + " to " + fmtDate(iso(new Date())), ""];
    groups(recs).forEach(function (g) {
      L.push(g.name + ": " + g.cn + " credit note" + (g.cn === 1 ? "" : "s") + " received, " + g.open + " open");
      g.recs.forEach(function (r) { r.pending.forEach(function (p) { L.push("  - awaiting " + (p.invoice || "credit note") + (p.reason ? " (" + p.reason + ")" : "")); }); });
    });
    return L.join("\n");
  }
  function csvCell(s) { s = String(s == null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv() {
    var rows = [["Vendor", "Entity", "Thread", "Category", "Status", "CN ref", "CN date", "Received", "Invoices", "Amount INR", "Files", "Awaiting invoice", "Awaiting reason", "Asked", "Summary", "Next action", "Gmail"]];
    currentRecs().forEach(function (r) {
      var base = [r.vendor, r.entity, r.subject, r.category, r.status];
      r.credit_notes.forEach(function (n) { rows.push(base.concat([n.ref, n.cn_date, n.received_date, (n.invoices || []).join("; "), n.amount, (n.files || []).join("; "), "", "", "", r.summary, r.next_action, gmailLink(r.threadId)])); });
      r.pending.forEach(function (p) { rows.push(base.concat(["", "", "", "", "", "", p.invoice, p.reason, p.asked_date, r.summary, r.next_action, gmailLink(r.threadId)])); });
      if (!r.credit_notes.length && !r.pending.length) rows.push(base.concat(["", "", "", "", "", "", "", "", "", r.summary, r.next_action, gmailLink(r.threadId)]));
    });
    var blob = new Blob(["﻿" + rows.map(function (x) { return x.map(csvCell).join(","); }).join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "credit-notes-" + iso(new Date()) + ".csv"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function copyText(t) {
    var ok = function () { toast("Summary copied"); };
    var fb = function () { var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) { toast("Select the text and copy it manually"); } ta.remove(); };
    try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); }
  }

  /* ---------- live sync: Google sign-in, Gmail API, Claude via local server ---------- */
  function setStatus(kind, text, pct) {
    $("dot").className = "dot " + kind; $("stext").textContent = text;
    var bw = $("barwrap"); bw.hidden = pct == null; if (pct != null) $("bar").style.width = Math.round(pct * 100) + "%";
  }
  function loadGsi() {
    return new Promise(function (res, rej) {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      var s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onload = function () { res(); }; s.onerror = function () { rej({ msg: "Could not load Google sign-in. Check your internet connection." }); };
      document.head.appendChild(s);
    });
  }
  function getToken() {
    if (S.token) return Promise.resolve(S.token);
    return loadGsi().then(function () {
      return new Promise(function (res, rej) {
        var tc = google.accounts.oauth2.initTokenClient({
          client_id: S.cfg.googleClientId, scope: "https://www.googleapis.com/auth/gmail.readonly",
          callback: function (r) { if (r && r.access_token) { S.token = r.access_token; res(S.token); } else rej({ msg: "Google sign-in was cancelled or refused." + (r && r.error ? " (" + r.error + ")" : "") }); },
          error_callback: function (e) { rej({ msg: "Google sign-in did not complete" + (e && e.type ? " (" + e.type + ")" : "") + ". Allow pop-ups for this page and try again." }); }
        });
        tc.requestAccessToken({ prompt: "" });
      });
    });
  }
  function gfetch(path) {
    return fetch("https://gmail.googleapis.com/gmail/v1/users/me/" + path, { headers: { Authorization: "Bearer " + S.token } }).then(function (r) {
      if (r.status === 401) { S.token = null; throw { msg: "Google session expired. Press the button again to sign in." }; }
      if (r.status === 403) throw { msg: "Gmail refused access (403). Check that the Gmail API is enabled and your account is added as a test user." };
      if (r.status === 429) throw { msg: "Gmail is rate limiting. Wait a minute and sync again." };
      if (!r.ok) throw { msg: "Gmail error " + r.status };
      return r.json();
    });
  }
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); var bin = atob(s), bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function walk(p, o) {
    if (p.filename) o.files.push(p.filename);
    if (p.mimeType === "text/plain" && p.body && p.body.data) o.plain += b64(p.body.data);
    else if (p.mimeType === "text/html" && p.body && p.body.data) o.html += b64(p.body.data);
    (p.parts || []).forEach(function (x) { walk(x, o); });
  }
  function htmlToText(h) { if (!h) return ""; var d = new DOMParser().parseFromString(h, "text/html"); d.querySelectorAll("style,script").forEach(function (n) { n.remove(); }); return (d.body.textContent || "").replace(/\s+\n/g, "\n"); }
  function trimBody(t) {
    t = (t || "").replace(/\r/g, "").replace(/\n{3,}/g, "\n\n").trim();
    var i = t.search(/\n\s*(On .{5,100} wrote:|From:\s.*\n\s*Sent:|-{2,}\s*Forwarded message|_{8,})/i);
    return i > 200 ? t.slice(0, i) : t;
  }
  function compact(t) {
    var msgs = (t.messages || []).map(function (m) {
      var h = {}; ((m.payload && m.payload.headers) || []).forEach(function (x) { h[x.name.toLowerCase()] = x.value; });
      var o = { plain: "", html: "", files: [] }; walk(m.payload || {}, o);
      return { date: new Date(Number(m.internalDate)).toISOString().slice(0, 10), from: h.from || "", subject: h.subject || "", files: o.files.filter(function (f) { return !/^image\d*\.(png|jpe?g|gif)$/i.test(f); }), body: trimBody(o.plain || htmlToText(o.html)) };
    });
    var cap = Math.max(900, Math.floor(12000 / Math.max(1, msgs.length)));
    msgs.forEach(function (m) { m.body = m.body.slice(0, cap); });
    return { threadId: t.id, subject: (msgs[0] && msgs[0].subject) || "", messages: msgs };
  }
  function pool(items, n, fn) {
    var out = [], i = 0;
    return Promise.all(Array.from({ length: Math.min(n, items.length) }, function () {
      return (function next() { if (i >= items.length) return Promise.resolve(); var k = i++; return fn(items[k], k).then(function (r) { out[k] = r; }, function (e) { out[k] = { error: e }; }).then(next); })();
    })).then(function () { return out; });
  }
  function classifyBatch(threads) {
    return fetch("/api/classify", { method: "POST", headers: { "Content-Type": "application/json", "X-CND": "1" }, body: JSON.stringify({ periodStart: iso(periodStart()), threads: threads }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw { msg: j.error || ("Server error " + r.status) }; return j.records; }); });
  }
  function sync() {
    var btn = $("sync"); btn.disabled = true;
    if (!S.cfg) { setStatus("err", "Open this page through server.py (http://localhost:8080) to sync."); btn.disabled = false; return; }
    if (!S.cfg.googleClientId || !S.cfg.hasClaudeKey) { renderSetup(); btn.disabled = false; return; }
    var cache = restore("cache", {}), failures = 0;
    setStatus("busy", "Signing in to Google…", 0.02);
    getToken().then(function () {
      setStatus("busy", "Searching Gmail…", 0.05);
      var q = '("credit note" OR "credit memo" OR "credit-note" OR "CN against") after:' + ymd(periodStart()), all = [];
      return (function page(tok) {
        return gfetch("threads?maxResults=100&q=" + encodeURIComponent(q) + (tok ? "&pageToken=" + tok : "")).then(function (j) {
          all = all.concat(j.threads || []); setStatus("busy", "Found " + all.length + " threads…", 0.08);
          return j.nextPageToken && all.length < 500 ? page(j.nextPageToken) : all;
        });
      })("");
    }).then(function (list) {
      var todo = list.filter(function (t) { return !cache[t.id + ":" + t.historyId]; }), done = 0;
      setStatus("busy", "Reading " + todo.length + " new or changed threads…", 0.1);
      return pool(todo, 4, function (t) { return gfetch("threads/" + t.id + "?format=full").then(function (full) { done++; setStatus("busy", "Reading emails " + done + " of " + todo.length, 0.1 + 0.3 * done / todo.length); return { t: t, c: compact(full) }; }); })
        .then(function (res) {
          var ok = res.filter(function (x) { if (x && x.error) { failures++; return false; } return !!x; }), batches = [];
          for (var i = 0; i < ok.length; i += 3) batches.push(ok.slice(i, i + 3));
          var d2 = 0;
          return pool(batches, 2, function (b) {
            return classifyBatch(b.map(function (x) { return x.c; })).then(function (recs) {
              recs.forEach(function (r, k) { cache[b[k].t.id + ":" + b[k].t.historyId] = r; });
              d2++; setStatus("busy", "Claude is classifying " + Math.min(d2 * 3, ok.length) + " of " + ok.length, 0.4 + 0.55 * d2 / batches.length);
            });
          }).then(function (r) { r.forEach(function (x) { if (x && x.error) { failures++; S.lastErr = x.error.msg; } }); return list; });
        });
    }).then(function (list) {
      var recs = list.map(function (t) { return cache[t.id + ":" + t.historyId]; }).filter(Boolean);
      var keep = {}; list.forEach(function (t) { keep[t.id + ":" + t.historyId] = cache[t.id + ":" + t.historyId]; });
      store("cache", keep);
      S.records = normalise(recs); S.source = "live"; S.meta = { generatedAt: fmtDate(iso(new Date())), threadsClassified: recs.length };
      store("last", { records: S.records, meta: S.meta });
      fillEntities(); render();
      setStatus(failures ? "err" : "on", failures ? "Synced with " + failures + " thread(s) skipped" + (S.lastErr ? ": " + S.lastErr : "") : "Live: " + recs.length + " threads synced", null);
    }).catch(function (e) { setStatus("err", (e && e.msg) || "Sync failed: " + e, null); }).then(function () { btn.disabled = false; });
  }
  function renderSetup() {
    var miss = [], c = S.cfg || {};
    if (!c.googleClientId) miss.push("<code>GOOGLE_CLIENT_ID</code> (Google sign-in)");
    if (!c.hasClaudeKey) miss.push("<code>ANTHROPIC_API_KEY</code> (Claude)");
    var el = $("setup");
    if (!miss.length) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<div class="note">Live sync needs ' + miss.join(" and ") + ' in <code>config.json</code> or as environment variables, then restart <code>server.py</code>. Steps are in README.md. The snapshot below still works.</div>';
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target, v = t.closest("[data-v]"), cat = t.closest("[data-cat]");
    if (v) { S.sel = v.getAttribute("data-v"); render(); window.scrollTo(0, 0); return; }
    if (cat) { var k = cat.getAttribute("data-cat"); S.cats[k] = !S.cats[k]; cat.setAttribute("aria-pressed", String(!!S.cats[k])); render(); return; }
    if (t.id === "openonly") { S.openOnly = !S.openOnly; t.setAttribute("aria-pressed", String(S.openOnly)); render(); return; }
    if (t.id === "copy") copyText(summaryText());
    if (t.id === "csv") exportCsv();
    if (t.id === "morefu") { S.showAllFu = !S.showAllFu; render(); }
  });
  $("q").addEventListener("input", function (e) { S.q = e.target.value.trim(); render(); });
  $("entity").addEventListener("change", function (e) { S.entity = e.target.value; render(); });
  $("period").addEventListener("change", function (e) { S.period = e.target.value; store("period", S.period); render(); });
  $("sync").addEventListener("click", sync);

  /* ---------- start ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function (b) { b.setAttribute("aria-pressed", "false"); });
  S.period = restore("period", "fy"); $("period").value = S.period;
  var last = restore("last", null), snap = null;
  try { snap = JSON.parse($("snapshot").textContent); } catch (e) {}
  if (last && last.records && last.records.length) { S.records = normalise(last.records); S.meta = last.meta; S.source = "live"; setStatus("on", "Showing your last live sync", null); }
  else if (snap) { S.records = normalise(snap.records); S.meta = { generatedAt: fmtDate(snap.meta.generatedAt), threadsClassified: snap.meta.threadsClassified }; setStatus("", "Showing snapshot. Press the button to sync live.", null); }
  fillEntities(); render();
  fetch("/api/config").then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { S.cfg = c; if (c) renderSetup(); else setStatus("", "Snapshot only. Run server.py for live sync.", null); }).catch(function () { setStatus("", "Snapshot only. Run server.py for live sync.", null); });
})();
</script>
