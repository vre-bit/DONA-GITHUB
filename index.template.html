<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Note Desk</title>
<style>
/* Layout: navy header band with sync controls, left vendor list, main panel (summary tiles, follow-up list, vendor cards). Alcove palette: navy, gold, red apex. */
:root {
  --bg: #f4f7fb; --surface: #ffffff; --surface2: #f8fafd; --line: #e1e8f1;
  --ink: #1c3654; --muted: #5f6f85; --navy: #204768; --navy-deep: #16324e; --on-navy: #ffffff;
  --gold: #efcc25; --gold-text: #8a6d0a; --red: #d82a30; --red-bg: #fbe9ea;
  --good: #1d7a54; --good-bg: #e3f3ea; --warn-bg: #fdf6da; --warn-line: #ecd98f; --warn-ink: #6b571f;
  --link: #204768;
  --font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a29; --surface: #142435; --surface2: #172b40; --line: #26425d; --ink: #e4ecf6; --muted: #9fb0c6;
    --navy: #2d5f8c; --navy-deep: #0f2437; --gold-text: #efcc25; --red: #ff7176; --red-bg: #3d1c20;
    --good: #62d3a3; --good-bg: #123428; --warn-bg: #3a3213; --warn-line: #6b5a1d; --warn-ink: #f1dc8a; --link: #9cc4ec;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.band { background: linear-gradient(135deg, var(--navy-deep), var(--navy)); color: var(--on-navy); border-bottom: 4px solid var(--gold); }
.band-in { max-width: 1280px; margin: 0 auto; padding: 18px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.band h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.band h1 span { color: var(--gold); }
.brand { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.grow { flex: 1; min-width: 0; }
.sync { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; max-width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa7ba; flex: none; }
.dot.on { background: #4fd69c; } .dot.busy { background: var(--gold); animation: pulse 1.1s ease-in-out infinite; } .dot.err { background: #ff7176; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
.btn { border: 1px solid var(--navy); background: var(--navy); color: var(--on-navy); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1c2b3a; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.band .btn.ghost { color: var(--on-navy); border-color: rgba(255,255,255,.4); }
.btn:disabled { opacity: .5; cursor: default; }
.bar { height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; width: 160px; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }

.setup { max-width: 1280px; margin: 14px auto 0; padding: 0 16px; }
.setup .note { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 8px; padding: 12px 16px; }
.alertbox { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 8px; padding: 10px 16px; }
.alertbox h3 { margin: 0 0 2px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.alertbox .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.alertbox .who { color: var(--muted); font-size: 12.5px; }
.al { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
.al a { font-weight: 600; overflow-wrap: anywhere; color: var(--link, var(--navy)); }
.al .snip { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
@media (max-width: 640px) { .al { grid-template-columns: minmax(0, 1fr); } }
.erpbox { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 8px; padding: 10px 16px; }
.erpbox h3 { margin: 0 0 2px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.erpbox .who, .modal .who { color: var(--muted); font-size: 12.5px; }
.erp-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 4px; }
.erp-tools input[type=search] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; font-size: 13px; min-width: 0; flex: 1 1 220px; max-width: 360px; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.ev { border-top: 1px solid var(--line); padding: 10px 0; }
.ev-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.ev-h b { font-size: 14px; overflow-wrap: anywhere; }
.ev-h .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eb { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) minmax(0, 230px); gap: 2px 14px; padding: 6px 0 6px 10px; border-left: 2px solid var(--line); margin-top: 6px; font-size: 13px; }
.eb .meta { display: block; color: var(--muted); font-size: 12px; }
.eb .bn { color: var(--ink); overflow-wrap: anywhere; }
.eb .em { font-size: 12.5px; color: var(--muted); }
.eb .em.ok { color: var(--good); }
.eb .em a { color: inherit; }
.eb .fu-done { display: block; color: var(--good); font-size: 12px; }
@media (max-width: 760px) { .eb { grid-template-columns: minmax(0, 1fr); } }
.modal { position: fixed; inset: 0; background: rgba(8, 18, 30, .55); display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 24px; z-index: 10; overflow: auto; }
.modal-in { width: 100%; max-width: 680px; padding: 16px 18px; display: grid; gap: 8px; }
.modal-in h3 { margin: 0; font-size: 16px; }
.modal-in label { display: grid; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.modal-in input, .modal-in textarea { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
.modal-in textarea { resize: vertical; }
.modal-in .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.paybox { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 8px; padding: 10px 16px; }
.paybox h3 { margin: 0 0 2px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.paybox h3 .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.paybox .who { color: var(--muted); font-size: 12.5px; }
.pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0; }
.pstats div { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.pstats b { display: block; font-size: 18px; }
.pstats span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pi { border-top: 1px solid var(--line); padding: 10px 0; }
.pi-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.pi-h b { font-size: 14px; overflow-wrap: anywhere; }
.pi-h .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pi-msg { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--surface2); font-size: 13px; overflow-wrap: anywhere; white-space: pre-line; }
.pi-tw { overflow-x: auto; }
.pi table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 620px; }
.pi th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 4px 8px; }
.pi td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.pi .age { font-weight: 700; color: var(--red); }
.pi .ok { color: var(--good); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link, var(--navy)); text-decoration: underline; cursor: pointer; font: inherit; }
.setup code { font-family: var(--mono); background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; }

.layout { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 860px) { .side { position: static; max-height: 280px; } }
.side h2 { margin: 0; padding: 12px 14px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.vlist { overflow-y: auto; padding: 0 6px 8px; }
.v { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; min-width: 0; }
.v:hover { background: var(--surface2); }
.v[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.v .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; flex: none; }
.badge.open { background: var(--red-bg); color: var(--red); }
.badge.ok { background: var(--good-bg); color: var(--good); }
.v[aria-pressed="true"] .badge { background: rgba(255,255,255,.2); color: var(--on-navy); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; margin-bottom: 14px; }
.filters input[type=search], .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-width: 0; font-size: 13px; }
.filters input[type=search] { flex: 1 1 200px; }
.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { padding: 12px 14px; border-top: 3px solid var(--gold); min-width: 0; }
.tile.alert { border-top-color: var(--red); }
.tile .k { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile .val { font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .val { color: var(--ink); } }
.tile.alert .val { color: var(--red); }
.tile .s { font-size: 12px; color: var(--muted); }

.section-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 18px 0 8px; }
.section-h h2 { margin: 0; font-size: 17px; padding-bottom: 3px; border-bottom: 3px solid var(--gold); }
.spacer { flex: 1; }
.note-box { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 8px; padding: 6px 16px; }
.fu { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--warn-line); align-items: baseline; }
.fu:first-child { border-top: 0; }
.fu b { overflow-wrap: anywhere; }
.fu .days { font-weight: 700; color: var(--red); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fu button { border: 0; background: none; padding: 0; color: inherit; font-weight: 700; text-align: left; cursor: pointer; text-decoration: underline; }
@media (max-width: 640px) { .fu { grid-template-columns: minmax(0, 1fr) auto; } .fu > :nth-child(2) { grid-column: 1 / -1; order: 3; } }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--navy); color: var(--on-navy); text-align: left; padding: 8px 12px; font-weight: 600; white-space: nowrap; }
td { padding: 8px 12px; border-top: 1px solid var(--line); }
tr:nth-child(even) td { background: var(--surface2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td button { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-weight: 600; text-align: left; }

.thread { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 4px 16px; }
.thread:first-child { border-top: 0; }
.thread .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.thread .d small { display: block; font-weight: 400; color: var(--muted); }
.thread .t { font-weight: 600; overflow-wrap: anywhere; }
.thread .sum { color: var(--muted); margin: 2px 0 6px; }
@media (max-width: 640px) { .thread { grid-template-columns: minmax(0, 1fr); } }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 6px; letter-spacing: .02em; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.neutral { background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.cn { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.cn:first-of-type { border-top: 0; }
.tag { font-family: var(--mono); font-size: 11.5px; background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; overflow-wrap: anywhere; }
.tag.pdf { font-family: var(--font); border-color: var(--gold); }
.tag.pdf::before { content: "PDF "; font-weight: 700; color: var(--gold-text); }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.pend { color: var(--red); font-size: 13px; padding: 3px 0; }
.act { font-size: 13px; margin-top: 6px; padding: 6px 10px; background: var(--warn-bg); border-radius: 6px; color: var(--warn-ink); }
.lowc { font-size: 12px; color: var(--muted); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.foot { max-width: 1280px; margin: 0 auto; padding: 0 16px 36px; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy-deep); color: var(--on-navy); padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 5; max-width: calc(100% - 32px); }
.toast[hidden], [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div>
    <div class="brand">Alcove Realty · Vendor accounts</div>
    <h1>Credit Note <span>Desk</span></h1>
  </div>
  <div class="grow"></div>
  <div class="sync">
    <select id="period" class="btn ghost" aria-label="Period">
      <option value="fy">This financial year</option>
      <option value="6">Last 6 months</option>
      <option value="3">Last 3 months</option>
      <option value="1">Last month</option>
    </select>
    <button class="btn gold" id="sync" type="button">Connect Gmail and sync</button>
    <button class="btn ghost" id="signout" type="button" hidden>Sign out</button>
    <span class="bar" id="barwrap" hidden><i id="bar"></i></span>
    <span class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="stext"></span></span>
  </div>
</div></header>
<div class="setup" id="setup" hidden></div>
<div class="setup" id="alerts" hidden></div>
<div class="setup" id="pay" hidden></div>
<div class="setup" id="erp" hidden></div>
<div class="modal" id="mailbox" role="dialog" aria-modal="true" aria-labelledby="mb-title" hidden>
  <div class="modal-in card">
    <h3 id="mb-title">Vendor follow-up mail</h3>
    <p class="who" style="margin:0">Nothing is sent until you press <b>Approve &amp; send</b>. Edit anything first.</p>
    <label>To <input id="mb-to" type="text" placeholder="vendor@example.com" autocomplete="off"></label>
    <div class="who" id="mb-tohint"></div>
    <label>Cc <input id="mb-cc" type="text" autocomplete="off"></label>
    <label>Subject <input id="mb-subject" type="text" autocomplete="off"></label>
    <label>Message <textarea id="mb-body" rows="14"></textarea></label>
    <div class="who" id="mb-msg"></div>
    <div class="acts">
      <button class="btn ghost" id="mb-cancel" type="button">Cancel</button>
      <button class="btn ghost" id="mb-copy" type="button">Copy text</button>
      <button class="btn gold" id="mb-send" type="button">Approve &amp; send</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="card side" aria-label="Vendors">
    <h2>Vendors</h2>
    <div class="vlist" id="vlist"></div>
  </aside>
  <main>
    <section class="card filters" id="filters" aria-label="Filters">
      <input type="search" id="q" placeholder="Search vendor, invoice, subject" aria-label="Search">
      <button class="chip" data-cat="received" type="button">Received</button>
      <button class="chip" data-cat="requested" type="button">Requested</button>
      <button class="chip" data-cat="partial" type="button">Partly received</button>
      <button class="chip" data-cat="adjusted" type="button">Adjusted</button>
      <button class="chip" id="openonly" type="button" aria-pressed="false">Open only</button>
      <select id="entity" aria-label="Alcove entity"><option value="">All entities</option></select>
    </section>
    <div id="tiles" class="tiles"></div>
    <div id="view"></div>
  </main>
</div>
<p class="foot" id="foot"></p>
<div class="toast" id="toast" hidden></div>

<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var S = { records: [], meta: {}, source: "snapshot", sel: "all", cats: {}, openOnly: false, entity: "", q: "", period: "fy", cfg: null, token: null, showAllFu: false };
  var CAT = { received: ["Credit note received", "good"], requested: ["Requested, awaiting", "red"], partial: ["Partly received", "warn"], adjusted: ["Adjusted in payment", "neutral"], mentioned: ["Mentioned only", "neutral"], not_relevant: ["Not relevant", "neutral"] };

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var money = function (n) { return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(n); };
  function fmtDate(iso) { if (!iso) return "-"; var d = new Date(iso + (iso.length === 10 ? "T00:00:00" : "")); return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); }
  function daysSince(iso) { if (!iso) return null; var d = new Date(iso + "T00:00:00"); return isNaN(d) ? null : Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000)); }
  function gmailLink(id) { return "https://mail.google.com/mail/u/0/#all/" + encodeURIComponent(id); }
  function store(k, v) { try { localStorage.setItem("cnd2." + k, JSON.stringify(v)); } catch (e) {} }
  function restore(k, d) { try { var v = localStorage.getItem("cnd2." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2800); }
  function periodStart() {
    var d = new Date();
    if (S.period === "fy") return new Date(d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1, 3, 1);
    d.setMonth(d.getMonth() - Number(S.period)); return d;
  }
  function ymd(d) { return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  var STOP = /\b(pvt|private|ltd|limited|llp|co|company|corp|corporation|inc|and)\b/g;
  function canon(n) { return String(n || "").toLowerCase().replace(/&/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(STOP, " ").replace(/\s+/g, ""); }
  function normalise(recs) {

    $("mb-subject").value = "Payment status of your invoice" + (x.invs.length > 1 ? "s" : "") + " - Alcove Realty";
    $("mb-body").value = "Dear Sir/Madam,\n\nThank you for your mail regarding pending payment" + (x.raised ? " dated " + fmtDate(x.raised) : "") + ". The current status is:\n\n" + lines +
      "\n\nPlease feel free to reach out for any further clarification.\n\nThanks and regards,\n" + sign + "\nAccounts, Alcove Realty";
    $("mb-msg").innerHTML = S.cfg.canSend ? "" : 'Sending needs your permission in Google. <a href="login">Sign in again</a> and allow "Send email on your behalf". You can copy the text meanwhile.';
    $("mb-send").disabled = !S.cfg.canSend;
    $("mailbox").hidden = false; $("mb-body").focus();
    if (r.email) { $("mb-tohint").textContent = "Address from the payment issues sheet."; return; }
    $("mb-tohint").textContent = "No email in the sheet. Looking in your Gmail…";
    vendorEmails(r.vendor).then(function (list) {
      if (!E.draft || E.draft.key !== x.key) return;
      if (!list.length) { $("mb-tohint").textContent = "No address found. Type the vendor's email."; return; }
      if (!$("mb-to").value) $("mb-to").value = list[0];
      $("mb-tohint").innerHTML = "Found in your Gmail: " + list.map(function (a) { return '<button class="linkbtn" type="button" data-addr="' + esc(a) + '">' + esc(a) + "</button>"; }).join(", ") + " (click to add)";
    }).catch(function () { $("mb-tohint").textContent = "Type the vendor's email."; });
  }
  $("pay").addEventListener("click", function (e) {
    var t = e.target, d = t.closest("[data-pay]"), f = t.closest("[data-pf]");
    if (d) return openPayReply(Number(d.getAttribute("data-pay")));
    if (f) { P.f = f.getAttribute("data-pf"); return renderPay(); }
    if (t.id === "pay-refresh") loadPay(true);
  });
  $("pay").addEventListener("input", function (e) { if (e.target.id === "pay-q") { P.q = e.target.value.trim(); renderPay(); } });

  /* ---------- mail watch: popup when credit note, MTC, warranty or invoice mail arrives ---------- */
  var WATCH = [
    { label: "Credit note", q: '"credit note" OR "credit memo" OR "credit-note" OR "CN against"' },
    { label: "MTC", q: 'MTC OR "material test certificate" OR "mill test certificate" OR "test certificate"' },
    { label: "Warranty", q: 'warranty OR "warranty certificate" OR guarantee' },
    { label: "Invoice", q: 'invoice OR "tax invoice" OR "proforma invoice"' }
  ];
  var W = { timer: null, remind: null, busy: false, last: 0 }, BASE_TITLE = document.title;
  function watchState() { var w = restore("watch", null); return w && w.seen ? w : { since: Math.floor(Date.now() / 1000), seen: {}, alerts: [] }; }
  function hdr(m, name) { var h = ((m.payload && m.payload.headers) || []).filter(function (x) { return x.name.toLowerCase() === name; })[0]; return h ? h.value : ""; }
  function unent(s) { var t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
  function notify(title, body, threadId) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try {
      var n = new Notification(title, { body: body, tag: threadId || title });
      n.onclick = function () { window.focus(); if (threadId) window.open(gmailLink(threadId), "_blank", "noopener"); n.close(); };
    } catch (e) {}
  }
  function checkMail() {
    if (W.busy || !S.cfg || !S.cfg.signedIn) return;
    W.busy = true;
    var w = watchState(), started = Math.floor(Date.now() / 1000), found = {}, me = (S.cfg.email || "").toLowerCase();
    pool(WATCH, 2, function (c) {
      var q = "(" + c.q + ") after:" + (w.since - 120) + " -in:sent -in:drafts" + (me ? " -from:" + me : "");
      return gfetch("threads?maxResults=25&q=" + encodeURIComponent(q)).then(function (j) {
        (j.threads || []).forEach(function (t) {
          var k = t.id + ":" + t.historyId;
          if (!w.seen[k]) (found[k] = found[k] || { id: t.id, cats: [] }).cats.push(c.label);
        });
      });
    }).then(function (res) {
      var failed = res.some(function (x) { return x && x.error; }), keys = Object.keys(found), fresh = [];
      return pool(keys, 3, function (k) {
        return gfetch("threads/" + found[k].id + "?format=metadata").then(function (t) {
          var msgs = t.messages || [], m = msgs[msgs.length - 1] || {};
          var a = { id: found[k].id, cats: found[k].cats, subject: hdr(m, "subject") || "(no subject)",
            from: hdr(m, "from").replace(/<[^>]*>/, "").replace(/"/g, "").trim(), date: Number(m.internalDate) || Date.now(),
            snippet: unent(m.snippet || "").slice(0, 160) };
          w.seen[k] = started;
          w.alerts = w.alerts.filter(function (x) { return x.id !== a.id; }); w.alerts.unshift(a); fresh.push(a);
        });
      }).then(function (r2) {
        if (!failed && !r2.some(function (x) { return x && x.error; })) w.since = started;
        var ks = Object.keys(w.seen);
        if (ks.length > 600) ks.sort(function (a, b) { return w.seen[a] - w.seen[b]; }).slice(0, ks.length - 500).forEach(function (k) { delete w.seen[k]; });
        w.alerts = w.alerts.slice(0, 50); store("watch", w); W.last = Date.now();
        if (fresh.length > 3) notify(fresh.length + " new mails to check", fresh.map(function (a) { return a.cats[0] + ": " + a.subject; }).slice(0, 4).join("\n"));
        else fresh.forEach(function (a) { var en = erpNote(a); notify(a.cats.join(" + ") + ": " + a.subject, a.from + (en ? "\n" + en : "") + (a.snippet ? "\n" + a.snippet : ""), a.id); });
        if (fresh.length) toast(fresh.length + " new " + (fresh.length > 1 ? "mails" : "mail") + " on credit notes, MTCs, warranties or invoices");
        renderAlerts();
      });
    }).catch(function () {}).then(function () { W.busy = false; });
  }
  function remind() {
    var list = watchState().alerts;
    if (!list.length) return;
    notify("Reminder: " + list.length + " mail" + (list.length > 1 ? "s" : "") + " still to check", list.slice(0, 4).map(function (a) { return a.cats[0] + ": " + a.subject; }).join("\n"));
    toast("Reminder: " + list.length + " mail" + (list.length > 1 ? "s" : "") + " still to check");
  }
  function startWatch() { if (W.timer) return; checkMail(); W.timer = setInterval(checkMail, 120000); W.remind = setInterval(remind, 1800000); renderAlerts(); }
  function stopWatch() { clearInterval(W.timer); clearInterval(W.remind); W.timer = W.remind = null; renderAlerts(); }
  function renderAlerts() {
    var list = watchState().alerts, el = $("alerts"), on = !!(S.cfg && S.cfg.signedIn);
    document.title = (list.length ? "(" + list.length + ") " : "") + BASE_TITLE;
    if (!on && !list.length) { el.hidden = true; return; }
    var perm = "Notification" in window ? Notification.permission : "unsupported";
    var h = '<div class="alertbox"><h3><span>New mail alerts' + (list.length ? " (" + list.length + ")" : "") + '</span><span class="acts">' +
      (on && perm === "default" ? '<button class="btn gold" id="al-enable" type="button">Turn on desktop popups</button>' : "") +
      (on && perm === "denied" ? '<span class="who">Desktop popups are blocked for this site in your browser settings.</span>' : "") +
      (list.length ? '<button class="btn ghost" id="al-clear" type="button">Clear all</button>' : "") + "</span></h3>" +
      '<div class="who">' + (on ? "Watching Gmail every 2 minutes for credit notes, MTCs, warranties and invoices" +
        (W.last ? ". Last checked " + new Date(W.last).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "") +
        ". Keep this tab open." : "Sign in to Google to keep watching for new mail.") + "</div>";
    list.forEach(function (a) {
      h += '<div class="al"><span>' + a.cats.map(function (c) { return '<span class="pill warn">' + esc(c) + "</span>"; }).join("") + "</span>" +
        '<span><a href="' + esc(gmailLink(a.id)) + '" target="_blank" rel="noopener">' + esc(a.subject) + "</a> " +
        '<span class="who">' + esc(a.from) + " · " + esc(new Date(a.date).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })) + "</span>" +
        (a.snippet ? '<span class="snip">' + esc(a.snippet) + "</span>" : "") +
        (erpNote(a) ? '<span class="snip"><span class="pill neutral">ERP</span>' + esc(erpNote(a)) + "</span>" : "") + "</span>" +
        '<button class="btn ghost" type="button" data-done="' + esc(a.id) + '">Done</button></div>';
    });
    el.innerHTML = h + "</div>"; el.hidden = false;
  }
  $("alerts").addEventListener("click", function (e) {
    var t = e.target, d = t.closest("[data-done]"), w = watchState();
    if (t.id === "al-enable") { Notification.requestPermission().then(function (p) { if (p === "granted") notify("Popups are on", "You'll get a popup when new credit note, MTC, warranty or invoice mail arrives."); renderAlerts(); }); return; }
    if (t.id === "al-clear") w.alerts = [];
    else if (d) { var id = d.getAttribute("data-done"); w.alerts = w.alerts.filter(function (x) { return x.id !== id; }); }
    else return;
    store("watch", w); renderAlerts();
  });

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target, v = t.closest("[data-v]"), cat = t.closest("[data-cat]");
    if (v) { S.sel = v.getAttribute("data-v"); render(); window.scrollTo(0, 0); return; }
    if (cat) { var k = cat.getAttribute("data-cat"); S.cats[k] = !S.cats[k]; cat.setAttribute("aria-pressed", String(!!S.cats[k])); render(); return; }
    if (t.id === "openonly") { S.openOnly = !S.openOnly; t.setAttribute("aria-pressed", String(S.openOnly)); render(); return; }
    if (t.id === "copy") copyText(summaryText());
    if (t.id === "csv") exportCsv();
    if (t.id === "morefu") { S.showAllFu = !S.showAllFu; render(); }
  });
  $("q").addEventListener("input", function (e) { S.q = e.target.value.trim(); render(); });
  $("entity").addEventListener("change", function (e) { S.entity = e.target.value; render(); });
  $("period").addEventListener("change", function (e) { S.period = e.target.value; store("period", S.period); render(); });
  $("sync").addEventListener("click", sync);
  $("signout").addEventListener("click", function () {
    fetch("logout", { method: "POST", headers: { "X-CND": "1" } }).then(function () { S.cfg.signedIn = false; S.cfg.email = ""; stopWatch(); renderErp(); renderPay(); renderSetup(); setStatus("", "Signed out of Google.", null); });
  });

  /* ---------- start ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function (b) { b.setAttribute("aria-pressed", "false"); });
  S.period = restore("period", "fy"); $("period").value = S.period;
  var last = restore("last", null), snap = null;
  try { snap = JSON.parse($("snapshot").textContent); } catch (e) {}
  if (last && last.records && last.records.length) { S.records = normalise(last.records); S.meta = last.meta; S.source = "live"; setStatus("on", "Showing your last live sync", null); }
  else if (snap) { S.records = normalise(snap.records); S.meta = { generatedAt: fmtDate(snap.meta.generatedAt), threadsClassified: snap.meta.threadsClassified }; setStatus("", "Showing snapshot. Press the button to sync live.", null); }
  fillEntities(); render();
  var authErr = new URLSearchParams(location.search).get("auth_error");
  if (location.search) history.replaceState(null, "", location.pathname);
  fetch("api/config").then(function (r) { return r.ok ? r.json() : null; }).then(function (c) {
    S.cfg = c; if (!c) return setStatus("", "Snapshot only. Run server.py for live sync.", null);
    renderSetup();
    if (authErr) setStatus("err", "Google sign-in did not complete (" + authErr + ").", null);
    var auto = false; try { auto = sessionStorage.getItem("cnd2.autosync") === "1"; sessionStorage.removeItem("cnd2.autosync"); } catch (e) {}
    if (c.signedIn && auto) sync();
    if (c.signedIn) { startWatch(); loadErp(); loadPay(); } else renderAlerts();
  }).catch(function () { setStatus("", "Snapshot only. Run server.py for live sync.", null); });
})();
</script>
</body>
</html>
